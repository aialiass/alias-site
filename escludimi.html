<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Escludimi dalle statistiche · Alias</title>
<link rel="icon" href="/favicon.svg?v=2" type="image/svg+xml">
<style>
/* Pagina per il team, non linkata: segna questo browser perché le statistiche di visita non lo contino.
   Non carica lo script delle statistiche, quindi aprirla non conta come visita. */
@font-face { font-family: "Bricolage Grotesque"; font-weight: 200 800; font-stretch: 75% 100%; font-style: normal; font-display: swap; src: url("/font/bricolage-grotesque.woff2") format("woff2"); }

:root {
  color-scheme: light;
  --bg: #ffffff;
  --ink: #15161a;
  --soft: #55595f;
  --line-strong: #d3d0c8;
  --yellow: #ffb302;
  --purple: #3d1a5b;
  --on-purple: #ffffff;
  --brand: "Bricolage Grotesque", system-ui, -apple-system, "Segoe UI", sans-serif;
  --sans: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
}

* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--sans); font-size: 17px; line-height: 1.5; }
main { max-width: 560px; margin: 0 auto; padding: 72px 16px; }
h1 { font-family: var(--brand); font-size: 34px; line-height: 1.1; margin: 0 0 16px; }
p { margin: 0 0 16px; color: var(--soft); }
.stato { display: inline-block; padding: 6px 12px; border-radius: 999px; font-weight: 600; background: var(--yellow); color: var(--ink); }
.stato.off { background: var(--purple); color: var(--on-purple); }
button { font: inherit; margin-top: 8px; padding: 10px 16px; border-radius: 10px; border: 1px solid var(--line-strong); background: var(--bg); color: var(--ink); cursor: pointer; }
</style>
</head>
<body>
<main>
  <h1>Statistiche di visita</h1>
  <p id="stato" class="stato">Controllo questo browser…</p>
  <p id="spiega"></p>
  <button id="cambia" type="button" hidden></button>
</main>
<script>
(function () {
  var stato = document.getElementById("stato"), spiega = document.getElementById("spiega"), cambia = document.getElementById("cambia");
  function leggi() { try { return !!localStorage.getItem("va-disable"); } catch (_) { return null; } }
  function mostra() {
    var escluso = leggi();
    if (escluso === null) {
      stato.textContent = "Non riesco a segnare questo browser";
      spiega.textContent = "Il browser blocca la memoria locale, per esempio in una finestra privata. Riprova da una finestra normale.";
      cambia.hidden = true;
      return;
    }
    stato.className = escluso ? "stato" : "stato off";
    stato.textContent = escluso ? "Questo browser è escluso" : "Questo browser viene contato";
    spiega.textContent = escluso
      ? "Le tue visite ad alias-ai.it da questo browser non entrano nelle statistiche. Ripeti su ogni browser e dispositivo che usi."
      : "Le tue visite da questo browser entrano nelle statistiche come quelle di chiunque altro.";
    cambia.textContent = escluso ? "Torna a contarmi" : "Escludimi";
    cambia.hidden = false;
  }
  cambia.addEventListener("click", function () {
    try { if (leggi()) localStorage.removeItem("va-disable"); else localStorage.setItem("va-disable", "1"); } catch (_) {}
    mostra();
  });
  // aprire la pagina basta: segna il browser subito
  try { localStorage.setItem("va-disable", "1"); } catch (_) {}
  mostra();
})();
</script>
</body>
</html>
